apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfogram-api
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: portfogram-api=minimeisme/portfogram-api
    argocd-image-updater.argoproj.io/portfogram-api.update-strategy: latest
    argocd-image-updater.argoproj.io/portfogram-api.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/portfogram-api.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:./values-portfogram-api-dev.yaml
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  destination:
    namespace: portfogram
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - values-portfogram-api-dev.yaml
    path: apps/spring-boot
    repoURL: https://github.com/minina0407/portfogram-manifest.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      # observability(ServiceMonitor CRD 제공) sync-wave가 아직 안 끝났어도
      # dry-run 검증만 건너뛰고 나머지 리소스는 정상 적용되게 함
      - SkipDryRunOnMissingResource=true
