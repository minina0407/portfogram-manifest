# portfogram-auth - 인증/사용자 관리 서비스
# 배포 전략: Rolling Update (표준 Kubernetes Deployment)
# 이유: 인증 서비스는 상태가 없고(JWT 기반) 빠른 업데이트가 필요함
#       maxSurge: 1 → 한 번에 하나씩 추가 Pod 생성
#       maxUnavailable: 0 → 배포 중 서비스 중단 없음 (무중단 배포)

image:
  repository: minimeisme/portfogram-auth
  tag: "latest"
  pullPolicy: Always

replicaCount: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  fsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

container:
  httpPort: 8080
  managementPort: 8081

metrics:
  enabled: true
  path: "/actuator/prometheus"

service:
  type: ClusterIP
  port: 8080

secret:
  enabled: true
  name: database-credentials

probes:
  readiness:
    enabled: true
    path: /actuator/health/readiness
  liveness:
    enabled: true
    path: /actuator/health/liveness
  startup:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

# Rolling Update 전략: maxSurge/maxUnavailable 명시적으로 설정
# (이전에는 기본값 사용했으나 이제 의도적으로 제어)
strategy:
  type: rollingUpdate
  rollingUpdate:
    maxSurge: 1      # 동시에 추가로 올릴 수 있는 Pod 수
    maxUnavailable: 0 # 서비스 중단 허용 Pod 수 (0 = 완전 무중단)

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-dev
  tls:
    - hosts:
        - dev.portfogram.com
      secretName: dev-auth-cert-tls
  hosts:
    - host: dev.portfogram.com
      paths:
        - path: /api/v1/auth
          pathType: Prefix
        - path: /api/v1/users
          pathType: Prefix

networkPolicy:
  enabled: false

serviceAccount:
  create: false
  name: ""
