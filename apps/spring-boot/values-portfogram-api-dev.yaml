# portfogram-api - 사용자 트래픽 API (포트폴리오/댓글/이미지)
# 배포 전략: Blue/Green (Argo Rollouts)
# 이유: 사용자가 직접 접근하는 API이므로 배포 중 다운타임 없어야 하고
#       새 버전을 미리 검증(preview)한 뒤 트래픽을 전환할 수 있어야 함

image:
  repository: minimeisme/portfogram-api
  tag: "8b17987f8c130c98ae2901882b71eef9db5978ce"
  pullPolicy: Always
replicaCount: 2
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  fsGroup: 3000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
container:
  httpPort: 8080
  managementPort: 8081
metrics:
  enabled: true
  path: "/actuator/prometheus"
service:
  type: ClusterIP
  port: 8080
secret:
  enabled: true
  name: database-credentials
# 추가 환경 변수 (application.properties 값을 덮어씀)
# HikariCP 기본값은 앱의 application.properties에 있음 (api: max 50 / min-idle 10)
env: {}
probes:
  readiness:
    enabled: true
    path: /actuator/health/readiness
  liveness:
    enabled: true
    path: /actuator/health/liveness
  startup:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
# Blue/Green 전략: 트래픽을 active → preview로 전환, autoPromotion 비활성화로 수동 승인 가능
strategy:
  type: blueGreen
rollout:
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-dev
  tls:
  - hosts:
    - dev.portfogram.com
    secretName: dev-api-cert-tls
  hosts:
  - host: dev.portfogram.com
    paths:
    - path: /api
      pathType: Prefix
networkPolicy:
  enabled: false
serviceAccount:
  create: false
  name: ""
